# Runs on every pull request (and on pushes to main).
# Uses only a SYNTHETIC sample file generated during the run. The real UCI
# dataset is never downloaded or committed here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "False"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.17.6
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  unit-tests:
    name: Unit and integration tests (pytest, SYNTHETIC data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  dbt-build-synthetic:
    name: dbt build on SYNTHETIC sample
    runs-on: ubuntu-latest
    env:
      ROBOT_RAW_DIR: ${{ github.workspace }}/ci_synthetic/raw
      ROBOT_DB_PATH: ${{ github.workspace }}/ci_synthetic/ci.duckdb
      ROBOT_STATE_DIR: ${{ github.workspace }}/ci_synthetic/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Generate SYNTHETIC sample file (random values, not real robot data)
        run: python -m robot_pipeline.synthetic "$ROBOT_RAW_DIR/SYNTHETIC_cobot_logs.xlsx" --rows 500
      - name: Load SYNTHETIC sample (twice, to prove re-runs do not duplicate)
        run: |
          python ingest.py
          python ingest.py
      - name: dbt build (models + tests) on SYNTHETIC sample
        run: python -m robot_pipeline.dbt_runner build
      - name: Success test (raw vs clean) on SYNTHETIC sample
        run: python -m robot_pipeline.checks
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-check-report
          path: ci_synthetic/state/checks/
          if-no-files-found: ignore

  airflow-dag-check:
    name: Airflow DAG check (imports, schedule, order, retries)
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.4.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Airflow with its official constraints file
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install pytest==9.2.0
      - name: Test the DAG
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow_home
          REQUIRE_AIRFLOW: "1"
        run: |
          airflow db migrate   # DagBag reads the metadata DB; a fresh home has none
          pytest -v -p no:cacheprovider tests/test_airflow_dag.py

  kafka-stream-test:
    name: Kafka stream test (real broker, SYNTHETIC events)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.4.0
        ports:
          - 9092:9092
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      REQUIRE_KAFKA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-stream.txt
      - run: pip install -r requirements-stream.txt -r requirements-dev.txt
      - name: Wait for the broker
        run: |
          for i in $(seq 1 30); do
            python -c "import socket; socket.create_connection(('localhost', 9092), 1)" && exit 0
            sleep 2
          done
          echo "Kafka did not start" && exit 1
      - name: Stream tests against the broker (must not skip)
        run: pytest -v -m kafka -rs tests/test_stream.py

  databricks-transform-local:
    name: Databricks transformation on local Spark (SYNTHETIC data)
    runs-on: ubuntu-latest
    env:
      REQUIRE_SPARK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt pyspark==4.3.0
      - name: Spark tests (Java is preinstalled on the runner)
        run: pytest -v -rs tests/test_databricks_transform.py

  cloud-s3-mock:
    name: S3 upload against moto (no AWS account)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-dev.txt boto3==1.44.12 "moto[s3]==5.2.6"
      - name: Fail (not skip) if the libraries are missing
        run: python -c "import boto3, moto"
      - run: pytest -v -rs tests/test_cloud_s3.py
