version: 2

models:
  - name: fct_stop_events
    description: >
      One row per protective-stop episode (a run of consecutive rows marked
      as a stop, broken by any non-stop row, unknown row, or recording gap).
    columns:
      - name: stop_event_id
        description: Episode key.
        data_tests:
          - not_null
          - unique
      - name: started_at
        description: event_ts of the first stop row (UTC).
        data_tests:
          - not_null
      - name: ended_at
        description: event_ts of the last stop row (UTC).
        data_tests:
          - not_null
      - name: started_hour
        description: started_at truncated to the hour.
      - name: cycle_id_at_start
        description: Cycle number on the first stop row.
        data_tests:
          - not_null
      - name: stop_rows
        description: Number of log rows in the episode.
        data_tests:
          - not_null
      - name: duration_seconds
        description: ended_at minus started_at; 0 for a one-row episode.
        data_tests:
          - not_null
      - name: first_row_num
        description: row_num of the first stop row.
      - name: last_row_num
        description: row_num of the last stop row.
      - name: grip_lost_during_stop
        description: True if any row in the episode had grip_lost.
      - name: avg_joint_temperature
        description: Mean over the episode of the per-row average of the six joint temperatures.
      - name: max_joint_temperature
        description: Highest single joint temperature seen during the episode.
      - name: avg_total_abs_current
        description: Mean over the episode of the sum of absolute joint currents.
      - name: avg_total_abs_speed
        description: Mean over the episode of the sum of absolute joint speeds.
      - name: avg_tool_current
        description: Mean tool current during the episode.
      - name: seconds_since_previous_stop
        description: Seconds from the previous episode's end to this one's start; NULL for the first.

  - name: agg_stops_by_hour
    description: Stop counts and conditions per clock hour (UTC).
    columns:
      - name: hour_utc
        description: Start of the hour.
        data_tests:
          - not_null
          - unique
      - name: rows_total
        description: All log rows in the hour, including unknown status.
      - name: rows_known_status
        description: Rows with a stop value (stop or no_stop).
      - name: rows_unknown_status
        description: Rows whose stop value is missing. Reported, never guessed.
      - name: stop_rows
        description: Rows marked as a stop.
      - name: stop_events
        description: Stop episodes that started in the hour.
      - name: stop_row_rate
        description: stop_rows / rows_known_status.
      - name: grip_lost_rows
        description: Rows with grip_lost = true.
      - name: cycles_seen
        description: Distinct cycle numbers in the hour.
      - name: first_event_ts
        description: First log time in the hour.
      - name: last_event_ts
        description: Last log time in the hour.
      - name: minutes_recorded
        description: Minutes actually covered by rows (gaps excluded).
      - name: avg_joint_temperature
        description: Mean of the per-row average joint temperature.
      - name: avg_tool_current
        description: Mean tool current.

  - name: agg_stops_by_cycle
    description: Stop counts and conditions per cycle number.
    columns:
      - name: cycle_id
        description: The source cycle number.
        data_tests:
          - not_null
          - unique
      - name: cycle_stretches
        description: How many separate stretches of the log carry this cycle number (2 for cycles 224-227 and 229-233).
      - name: first_event_ts
        description: First log time with this cycle number.
      - name: last_event_ts
        description: Last log time with this cycle number.
      - name: rows_total
        description: All rows with this cycle number.
      - name: rows_known_status
        description: Rows with a stop value (stop or no_stop).
      - name: rows_unknown_status
        description: Rows with no stop value.
      - name: stop_rows
        description: Rows marked as a stop.
      - name: stop_events
        description: Stop episodes that started in this cycle.
      - name: had_stop
        description: True if any row in the cycle was a stop.
      - name: grip_lost_rows
        description: Rows with grip_lost = true.
      - name: avg_joint_temperature
        description: Mean of the per-row average joint temperature in the cycle.
      - name: max_joint_temperature
        description: Highest single joint temperature in the cycle.
      - name: avg_total_abs_current
        description: Mean of the per-row sum of absolute joint currents.
      - name: avg_tool_current
        description: Mean tool current in the cycle.
