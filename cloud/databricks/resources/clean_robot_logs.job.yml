resources:
  jobs:
    clean_robot_logs:
      name: clean_robot_logs
      tasks:
        - task_key: clean
          spark_python_task:
            python_file: ../src/clean_robot_logs.py
            parameters:
              - --input
              - ${var.staged_input}
              - --output
              - ${var.output_table}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
