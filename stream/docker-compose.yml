# Single-node Kafka (KRaft mode, no ZooKeeper) for the simulated stream.
# The official image's default config runs one combined broker+controller
# and advertises PLAINTEXT://localhost:9092.
#   docker compose -f stream/docker-compose.yml up -d
#   docker compose -f stream/docker-compose.yml down
services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: robot-kafka
    ports:
      # Bound to localhost only: this broker has no authentication or TLS,
      # so it must not be reachable from other machines.
      - "127.0.0.1:9092:9092"
